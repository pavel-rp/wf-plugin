name: CI

# Gate the validator-fixture suites on every PR (and on push to main as a
# backstop). The gate is capability-agnostic: it runs the registry-level suite
# explicitly and then discovers every capability profile-fixtures suite by the
# convention `plugins/*/capabilities/*/fixtures/run.sh` — it never names a
# specific capability, so any future capability that ships a fixtures run.sh is
# gated automatically.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fixtures:
    name: Validator fixture suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # THE BASE REF MUST BE IN THIS CHECKOUT. The glossary gate below is
          # on-touch: it fails only on files the PR touched or added, which means
          # it has to diff against the PR's base commit. actions/checkout@v4
          # defaults to a depth-1 clone that does NOT contain that commit, and a
          # gate that cannot see its base would compute an empty touched set and
          # pass while scanning nothing. `fetch-depth: 0` fetches full history so
          # the base commit and a real merge base are always present.
          #
          # This is belt-and-braces, not the only guard: glossary-on-touch.sh
          # treats an empty touched set as a mis-computed diff and exits 2, so if
          # this depth is ever regressed the gate fails loudly instead of going
          # quietly green.
          fetch-depth: 0

      - name: Ensure jq is present
        # validate-profile.sh exits 2 when jq is absent. ubuntu-latest ships jq,
        # but confirm it rather than assume — a future runner-image change must
        # not silently regress the profile suite into an exit-2 environment
        # error masquerading as a validation failure.
        run: command -v jq >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y jq; }

      - name: Registry-level validation suite
        # Run verbatim. A non-zero exit fails this step (and the job).
        run: bash plugins/wf/skills/_contracts/registry-fixtures/run.sh

      - name: Glossary vocabulary gate (on-touch)
        # The authored-prose vocabulary gate. It is deliberately NOT inside
        # registry-fixtures/run.sh like the other guards: the severity model is
        # on-touch, so the gate needs the PR's base sha — workflow-level git
        # context the guard chain has no access to. run.sh gates the scoping
        # SELF-TEST; this step runs the gate itself.
        #
        # On a pull_request run, base.sha is the PR's base commit and the step
        # lints exactly the files this PR touched or added. On a push to main
        # the expression is empty, --base is omitted, and the gate degrades to a
        # documented no-op (the catch still runs via the self-test in run.sh) —
        # so main can never be failed by a pre-existing violation.
        run: |
          bash plugins/wf/skills/_contracts/glossary-on-touch.sh \
            ${{ github.event.pull_request.base.sha && format('--base {0}', github.event.pull_request.base.sha) || '' }}

      - name: Sandbox-testing assertion suite
        # The WF-346 statistical assertion layer over the WF-345 runner's outputs. Not a
        # capability fixtures suite (the sandbox-testing capability ships no
        # capabilities/*/fixtures/run.sh — its suites live under assert/ and corpus/), so
        # it is named explicitly here — in the same validate-registry.sh / registry-fixtures
        # family. It runs entirely against committed CANNED run outputs (no container, no
        # model), proving the green report, the red report, the baseline comparison, the
        # per-tier settings-key flip, and the no-exact-match / no-orchestrator grep guards.
        # A non-zero exit fails this step (and the job).
        run: bash plugins/wf-sandbox-testing/assert/run.sh

      - name: Sandbox-testing corpus self-check
        # The WF-347 behavioral-regression corpus over the WF-345 runner's outputs, judged by
        # the WF-346 assertion layer. Like the assertion suite above it runs entirely against
        # committed CANNED run outputs (no container, no model, no token), proving: the
        # per-item provenance audit (zero unprovenanced items), the mechanical declared-slot
        # enumeration, the per-slot empty-slot flagship (unfilled ≡ pinned pre-slot baseline;
        # a seeded slot-fill diverges), the fingerprinted baseline-arm record, and the WF-313
        # review-gate five-requirements scenario (green against wf-fake scripted threads; a
        # seeded "merged while claiming no review landed" turns red). Non-zero exit fails the job.
        run: bash plugins/wf-sandbox-testing/corpus/run.sh

      - name: Ensure node is present
        # The mechanism-signal suite below is the first thing in THIS job to need node — the job
        # runs no setup-node (that lives in the separate resolver-runtime job). ubuntu-latest ships
        # node, but confirm it rather than assume, exactly as the jq step above does. The suite does
        # hard-stop on its own with node absent (exit 3, FIXTURE ERROR) — this step just fails at a
        # legible place with a legible message instead of fifteen lines into the run.
        run: node --version

      - name: Sandbox-testing mechanism-signal suite
        # The experiment engine's mechanism-signal validator/evaluator regression suite. Like the
        # two above it is offline — every fixture is synthesized under a temp dir, no container, no
        # model, no token. It does READ the fleet-ab kit (the containment cases need a real
        # protected directory to aim at) and asserts that kit's results/ byte-unchanged across the
        # containment cases — and it lives under
        # experiments/engine/ rather than assert/ or corpus/, so neither of those runners and
        # neither convention-discovery glob picks it up. It has to be named to run at all.
        #
        # It is named here because a suite that never executes is the same defect it exists to
        # catch: a check whose success path is reachable without doing the work. Its cases cover
        # the silent-no-op entry point, the measured-zero over an absent dimension, the results/
        # containment guard, and the usage-vs-mismatch exit vocabulary. Non-zero exit fails the job.
        run: bash plugins/wf-sandbox-testing/experiments/engine/selfcheck.sh

      - name: Each capability's fixture suite
        # Discover every capability fixtures suite by convention — never name a
        # specific capability, so any future capability that ships a fixtures
        # run.sh is gated automatically. Zero matches is a valid skip: no
        # capability currently vendored in this marketplace ships a fixtures
        # run.sh (the migration reference capability, the only one that did,
        # moved to the private wf-caps marketplace per WF-261). The registry-level
        # suite above still gates the validator itself unconditionally.
        # `shell: bash` is explicit: the step relies on bash-only features
        # (`shopt -s nullglob`, arrays). ubuntu-latest defaults `run:` to bash,
        # but pinning it guards against a default fallback to sh.
        shell: bash
        run: |
          shopt -s nullglob
          suites=(plugins/*/capabilities/*/fixtures/run.sh)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "No capability fixture suites present (plugins/*/capabilities/*/fixtures/run.sh) — nothing to run."
            exit 0
          fi
          failed=0
          for suite in "${suites[@]}"; do
            echo "=== Running $suite ==="
            if ! bash "$suite"; then
              echo "FAILED: $suite" >&2
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "$failed capability fixture suite(s) failed." >&2
            exit 1
          fi

  resolver-runtime:
    name: Resolver runtime (bundle + smoke on min Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/wf/mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the DECLARED MINIMUM Node
        # The resolver runtime declares Node.js >=20 (see plugins/wf/mcp
        # engines.node and the dist/server.mjs launcher guard). Pin the floor so
        # the reproducible-build check and the clean-copy smoke handshake are
        # proven against the minimum supported interpreter, not just whatever
        # Node the runner happens to ship.
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned dependencies
        # `npm ci` installs the exact lockfile tree (dev deps only: esbuild).
        # Production startup needs none of this — the committed bundle is
        # self-contained — but the build/verify steps do.
        run: npm ci

      - name: Verify the committed bundle is reproducible and not stale
        # Rebuilds from src + lockfile and byte-compares against committed dist/.
        # A stale bundle fails the job.
        run: npm run verify-bundle

      - name: Clean-copy smoke test (MCP handshake, no repo / no node_modules)
        # Copies only the shipped payload to a clean temp location and drives the
        # MCP protocol handshake against the declared minimum Node.
        run: npm run smoke

      - name: Resolver contract tests (schema, persistence, resolution)
        # Bundles each test/*.test.ts with esbuild (already pinned) and runs it
        # under node:test on the declared minimum Node. Covers the resolver
        # schema, atomic snapshot persistence, plugin-anchored resolution, the
        # four pack states, and the `claude plugin list --json` CLI-output
        # contract fixtures.
        run: npm test

  smoke:
    name: SMOKE tier (path-triggered, secret-gated)
    # The WF-350 model-driven SMOKE assertion gate. It is NEW wiring ON TOP of the deterministic
    # suites above (which stay byte-untouched and run on every PR) — it does NOT replace them.
    #
    # This job runs on every PR (the workflow-level `on: pull_request` has no paths filter, because
    # the fixtures/resolver jobs must gate every PR), but its JUDGED steps fire only when BOTH:
    #   (a) the PR touched a trigger path (a skill, a capability/fragment, or the resolver), and
    #   (b) the CLAUDE_CODE_OAUTH_TOKEN repo secret is present.
    # When either is false the judged steps are skipped with a stated reason and the job SUCCEEDS —
    # so a non-trigger PR spends no model quota, and a PR is never blocked red before the maintainer
    # provisions the secret (inert-safe rollout; charter Assumption 6 / OUT-5).
    #
    # MANUAL MAINTAINER STEP (one-time, to make the gate live): mint a subscription token on the host
    # with `claude setup-token`, then add it as the repo secret `CLAUDE_CODE_OAUTH_TOKEN`. The token is
    # injected only at container runtime (`docker run -e CLAUDE_CODE_OAUTH_TOKEN`, name-only) by the
    # packaged wrapper — never a build arg, image layer, cache, or logged value; ANTHROPIC_API_KEY is
    # never set (billing is the subscription). If GitHub Actions proves unsuitable, the documented
    # host-side fallback is running the same `plugins/wf-sandbox-testing/ci/smoke-gate.sh` per
    # trigger-path PR and recording the verdict (see the pack README).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The per-job path gate diffs against the PR's base commit; a depth-1 clone would not
          # contain it. Full history keeps the base commit and merge-base present (same reason the
          # fixtures job pins fetch-depth: 0 for the on-touch glossary gate).
          fetch-depth: 0

      - name: Detect trigger-path changes
        id: paths
        # Per-JOB path gate (NOT a workflow-level `paths:` filter — the other jobs must stay
        # unfiltered). Trigger paths: any skill, any capability (fragments live under capabilities),
        # or the resolver runtime. A push / empty-base run degrades to a documented no-op skip.
        shell: bash
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            echo "No PR base ref (push or non-PR event) — smoke path gate is a documented no-op."
            echo "match=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "Changed files this PR:"; printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^plugins/[^/]+/skills/|^plugins/[^/]+/capabilities/|^plugins/wf/mcp/'; then
            echo "A trigger path changed — the smoke tier is applicable."
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "No trigger-path files changed — the smoke tier will be skipped (quota preserved)."
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect OAuth token secret
        id: secret
        # Read the secret into an env var and set a boolean output from its NON-EMPTINESS only —
        # the value is never printed. This is what keeps the job inert-safe before the secret exists.
        shell: bash
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "${TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN secret is present."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN secret is NOT set — smoke tier will be skipped (inert-safe)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve smoke-gate applicability
        id: gate
        # Combine the two gates and emit a single stated reason. The judged steps below key off
        # steps.gate.outputs.run; when it is false the job still SUCCEEDS (never a red).
        shell: bash
        run: |
          if [ "${{ steps.paths.outputs.match }}" = "true" ] && [ "${{ steps.secret.outputs.present }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "SMOKE tier WILL run: a trigger path changed and the OAuth secret is present."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.paths.outputs.match }}" != "true" ]; then
              echo "SMOKE tier skipped: no trigger-path files changed — no model quota spent on this PR."
            fi
            if [ "${{ steps.secret.outputs.present }}" != "true" ]; then
              echo "SMOKE tier skipped: CLAUDE_CODE_OAUTH_TOKEN repo secret is not set. This is inert-safe — the PR is NOT blocked. Maintainer: mint via 'claude setup-token' and add the repo secret to make the gate live."
            fi
          fi

      - name: Run SMOKE tier through the packaged pack
        # Judged step — DOGFOODS the pack's own wrapper (no produce/judge logic authored here). The
        # token reaches the wrapper's environment from the secret and reaches the CONTAINER only via
        # the wrapper's `docker run -e CLAUDE_CODE_OAUTH_TOKEN` (name-only); it is never on a command
        # line, a build arg, an image layer, or the report. A non-zero exit (a named failed assertion)
        # fails this step and the job — that is the gate turning red on a regression.
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          bash plugins/wf-sandbox-testing/ci/smoke-gate.sh \
            --report "$RUNNER_TEMP/smoke-report.txt"

      - name: Upload the variance-aware SMOKE report
        # Make the report available from the job on both green and red (so a red gate's named failed
        # assertion is inspectable). Skipped runs produce no report — ignore its absence.
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: ${{ runner.temp }}/smoke-report.txt
          if-no-files-found: ignore
